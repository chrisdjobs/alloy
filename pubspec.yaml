name: alloy
description: "Open source, local-first music player for Android and Linux."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audio_metadata_reader: ^1.8.1
  audio_service: ^0.18.19
  audio_service_mpris: ^0.2.1
  crypto: ^3.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  image: ^4.13.1
  intl: ^0.20.2
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  lucide_icons_flutter: ^4.0.3
  material_color_utilities: ^0.13.0
  material_ui: ^1.11.1
  media_kit_libs_linux: ^1.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.7
  rxdart: ^0.28.0
dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0
  very_good_analysis: ^11.0.0

flutter:
