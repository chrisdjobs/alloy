include: package:very_good_analysis/analysis_options.yaml

# Layer rules from AGENTS.md are enforced by test/architecture_test.dart:
# `flutter test` fails when an import crosses a boundary it should not.

plugins:
  riverpod_lint: ^3.2.0

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
